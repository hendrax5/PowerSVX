# PowerSVX Linux — host networking (production VPS)
#
# Use when you need real client IPs (ACL / rate-limit / query log) and
# DNS on host :53. Do NOT overwrite this with the default bridge compose.
#
# Usage:
#   docker compose -f docker-compose.yml -f deploy/linux/docker-compose.host.yml up -d --build
#
# Hybrid recursive (default):
#   Unbound listens on 127.0.0.1:5353; PowerSVX defaults to forward → that address.
#   Conditional forward zones still override per domain.
#   See docs/UNBOUND-HYBRID.md.
#
# Capacity autosize (upgrade-friendly):
#   - PowerSVX: cache.max_size_mb=0 and resolver.max_inflight=0 → sized from RAM/CPU at start
#   - Unbound: run deploy/linux/gen-unbound-conf.sh before up (also in apply-update.sh)
#   After RAM/CPU upgrade: recreate powersvx (+ unbound) — no TOML retune required.
#
# DB: with host network, PowerSVX must reach Postgres via the published host port:
#   configs/powersvx.docker.host.toml → host = "127.0.0.1", port = 5433
#
# Prometheus scrapes metrics via host.docker.internal:9100 (see prometheus.yml job powersvx-host).

services:
  powersvx:
    network_mode: host
    ports: !override []
    # Memory: percent of host RAM (default 70%). calc-mem-env.sh sets POWERSVX_MEM_LIMIT;
    # entrypoint sets GOMEMLIMIT to ~90% of that slice. Compose cannot do % natively.
    mem_limit: ${POWERSVX_MEM_LIMIT:-0}
    environment:
      - POWERSVX_MEM_PERCENT=${POWERSVX_MEM_PERCENT:-70}
      - GOGC=${GOGC:-50}
      # Host sysctl bind-mounts (see volumes) — Docker /proc/sys is otherwise read-only.
      - POWERSVX_CONNTRACK_SYS_DIR=/powersvx-sys
    # Keep postgres (from base compose) and start Unbound first for hybrid mode.
    depends_on:
      postgres:
        condition: service_healthy
      unbound:
        condition: service_started
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    volumes: !override
      - powersvx-cache:/data/cache
      - powersvx-data:/data
      - ./configs/powersvx.docker.host.toml:/etc/PowerSVX/powersvx.toml:ro
      - ./configs/sample-blocklist.txt:/etc/PowerSVX/sample-blocklist.txt:ro
      # Writable host kernel knobs (container /proc/sys is RO even as root).
      - /proc/sys/net/netfilter/nf_conntrack_max:/powersvx-sys/nf_conntrack_max
      - /proc/sys/net/netfilter/nf_conntrack_count:/powersvx-sys/nf_conntrack_count:ro
      - /sys/module/nf_conntrack/parameters/hashsize:/powersvx-sys/hashsize

  # Recursive engine for PowerSVX "Unbound backend" preset (loopback only).
  unbound:
    image: mvance/unbound:1.22.0
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./configs/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro

  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"

  prometheus:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: !override
      - "0.0.0.0:9091:9090"

  grafana:
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports: !override
      - "0.0.0.0:3000:3000"

volumes:
  powersvx-data:
