# PowerSVX Linux — host networking (production VPS)
#
# Dataplane options:
#   POWERSVX_DNS_DATAPLANE=dnsdist  — dnsdist :53 + CDB blocklist; Unbound 127.0.0.1:5353 (recommended)
#   POWERSVX_DNS_DATAPLANE=powersvx — Go edge :53 (lab)
#
# Usage:
#   export POWERSVX_DNS_DATAPLANE=dnsdist
#   bash deploy/linux/gen-unbound-conf.sh
#   bash deploy/linux/gen-dnsdist-conf.sh
#   eval "$(deploy/linux/calc-mem-env.sh)"
#   docker compose -f docker-compose.yml -f deploy/linux/docker-compose.host.yml up -d --build

services:
  powersvx:
    network_mode: host
    ports: !override []
    mem_limit: ${POWERSVX_MEM_LIMIT:-0}
    environment:
      - POWERSVX_MEM_PERCENT=${POWERSVX_MEM_PERCENT:-30}
      - POWERSVX_GOMEMLIMIT_FIXED=${POWERSVX_GOMEMLIMIT_FIXED:-0}
      - GOMEMLIMIT=${GOMEMLIMIT:-}
      - GOGC=${GOGC:-50}
      - POWERSVX_DNS_DATAPLANE=${POWERSVX_DNS_DATAPLANE:-dnsdist}
      - POWERSVX_HOST_DEPLOYMENT=1
      - POWERSVX_UNBOUND_RPZ_DIR=/data/unbound-rpz
      - POWERSVX_BLOCKLIST_DIR=/data/blocklist
      - POWERSVX_DNSTAP_DIR=/data/dnstap
      - POWERSVX_UNBOUND_CONTAINER=powersvx-unbound-1
      - POWERSVX_DNSDIST_KEY=${POWERSVX_DNSDIST_KEY:-powersvx-dnsdist-console}
      - POWERSVX_DNSDIST_CONTROL=127.0.0.1:5199
      - POWERSVX_DNSDIST_WEB=http://127.0.0.1:8083
      - POWERSVX_DNSDIST_WEB_PASSWORD=${POWERSVX_DNSDIST_WEB_PASSWORD:-powersvx}
      - POWERSVX_DNSDIST_API_KEY=${POWERSVX_DNSDIST_API_KEY:-powersvx-api}
      - POWERSVX_UNBOUND_CONTROL=127.0.0.1:8953
      - POWERSVX_CONNTRACK_SYS_DIR=/powersvx-sys
    depends_on:
      postgres:
        condition: service_healthy
      unbound:
        condition: service_started
      dnsdist:
        condition: service_started
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    volumes: !override
      - powersvx-cache:/data/cache
      - powersvx-data:/data
      - ./data/unbound-rpz:/data/unbound-rpz
      - ./data/blocklist:/data/blocklist
      - ./data/dnstap:/data/dnstap
      - ./data/unbound-logs:/data/unbound-logs
      - ./configs/powersvx.docker.host.toml:/etc/PowerSVX/powersvx.toml:ro
      - ./configs/sample-blocklist.txt:/etc/PowerSVX/sample-blocklist.txt:ro
      - /proc/sys/net/netfilter/nf_conntrack_max:/powersvx-sys/nf_conntrack_max
      - /proc/sys/net/netfilter/nf_conntrack_count:/powersvx-sys/nf_conntrack_count:ro
      - /sys/module/nf_conntrack/parameters/hashsize:/powersvx-sys/hashsize

  # Recurse-only behind dnsdist (127.0.0.1:5353). No huge RPZ.
  unbound:
    image: mvance/unbound:1.22.0
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./configs/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
      - ./data/unbound-rpz:/opt/unbound/etc/unbound/rpz:ro
      - ./data/unbound-logs:/opt/unbound/etc/unbound/logs
    healthcheck:
      test: ["CMD-SHELL", "drill -p 5353 google.com @127.0.0.1 A || drill -p 53 google.com @127.0.0.1 A || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Public :53 — CDB blocklist + bank whitelist → Unbound backend; DoT/DoH/DoQ when certs are mounted.
  # The image tag is pinned on purpose: see "Pinned dnsdist version" in deploy/linux/README.md.
  dnsdist:
    image: powerdns/dnsdist-19:1.9.16
    network_mode: host
    restart: unless-stopped
    depends_on:
      - unbound
    user: "0:0"
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./configs/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro
      - ./data/blocklist:/etc/dnsdist/blocklist:ro
      - ./data/dnstap:/etc/dnsdist/dnstap
      - ./certs:/etc/dnsdist/certs:ro
      - ./deploy/linux/dns-ready.sh:/usr/local/bin/dns-ready.sh:ro
    # Image ENTRYPOINT is already dnsdist — do NOT prefix "dnsdist" again
    # (that is parsed as a listen address → Fatal: Unable to convert ... 'dnsdist').
    command: ["--supervised", "--disable-syslog", "-C", "/etc/dnsdist/dnsdist.conf"]
    healthcheck:
      # A fresh name under .invalid is answered by Unbound without leaving the host,
      # so this fails when dnsdist or Unbound stops answering, not when upstream is down.
      test: ["CMD", "bash", "/usr/local/bin/dns-ready.sh", "-u", "invalid"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"

  # Host metrics on :9101 (PowerSVX process metrics stay on :9100).
  node-exporter:
    network_mode: host
    ports: !override []
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--web.listen-address=127.0.0.1:9101'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave

  prometheus:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: !override
      - "127.0.0.1:9091:9090"

  grafana:
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports: !override
      - "${GRAFANA_BIND_ADDR:-127.0.0.1}:3000:3000"

volumes:
  powersvx-data:
