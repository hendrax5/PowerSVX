# PowerSVX Linux — docker compose override for production ports
#
# Usage:
#   cp .env.example .env   # set strong secrets
#   docker compose -f docker-compose.yml -f deploy/linux/docker-compose.linux.yml up -d --build
#
# Requires free host port 53 (disable systemd-resolved stub if needed).
# All published ports bind 0.0.0.0 (all interfaces). Protect with firewall.

services:
  powersvx:
    ports: !override
      - "0.0.0.0:53:53/udp"
      - "0.0.0.0:53:53/tcp"
      - "0.0.0.0:853:853/tcp"
      - "0.0.0.0:443:443/tcp"
      - "0.0.0.0:784:784/udp"
      - "0.0.0.0:5380:5380"
      - "0.0.0.0:9100:9100"
    environment:
      - PG_PASSWORD=${PG_PASSWORD:?set PG_PASSWORD in .env}
      - API_TOKEN=${API_TOKEN:?set API_TOKEN in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - TZ=${TZ:-UTC}
    env_file:
      - path: .env
        required: true
    volumes: !override
      - powersvx-cache:/data/cache
      - powersvx-data:/data
      - ./configs/powersvx.docker.toml:/etc/PowerSVX/powersvx.toml:ro
      - ./configs/sample-blocklist.txt:/etc/PowerSVX/sample-blocklist.txt:ro
      # Do NOT mount an empty ./certs — it hides image self-signed certs and crashes TLS.
      # When you have real certs: uncomment the next line.
      # - ./certs:/etc/PowerSVX/certs:ro
    cap_add:
      - NET_BIND_SERVICE

  postgres:
    ports: !override
      - "0.0.0.0:5433:5432"

  prometheus:
    ports: !override
      # Host :9090 is often already taken; map UI to 9091 instead.
      - "0.0.0.0:9091:9090"

  grafana:
    ports: !override
      - "0.0.0.0:3000:3000"
    volumes: !override
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  powersvx-data:
  grafana-data:
