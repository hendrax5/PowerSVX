# PowerSVX Linux — docker compose override for production ports
#
# Usage:
#   cp .env.example .env   # set strong secrets
#   docker compose -f docker-compose.yml -f deploy/linux/docker-compose.linux.yml up -d --build
#
# Requires free host port 53 (disable systemd-resolved stub if needed).

services:
  powersvx:
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"
      - "443:443/tcp"
      - "784:784/udp"
      # API/UI: localhost only
      - "127.0.0.1:5380:5380"
      - "127.0.0.1:9100:9100"
    environment:
      - PG_PASSWORD=${PG_PASSWORD:?set PG_PASSWORD in .env}
      - API_TOKEN=${API_TOKEN:?set API_TOKEN in .env}
      - TZ=${TZ:-UTC}
    volumes:
      - powersvx-cache:/data/cache
      - powersvx-data:/data
      - ./configs/powersvx.docker.toml:/etc/PowerSVX/powersvx.toml:ro
      - ./configs/sample-blocklist.txt:/etc/PowerSVX/sample-blocklist.txt:ro
      - ./certs:/etc/PowerSVX/certs:ro

  postgres:
    ports: []  # no host publish — only on compose network

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  powersvx-data:
