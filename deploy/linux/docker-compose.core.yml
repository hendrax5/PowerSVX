# Core Profile overlay: Dataplane + Control Plane only.
#
# Core Profile:          dnsdist, unbound, powersvx, watchtower
# Observability Profile: postgres (query-log history), prometheus, grafana, node-exporter
#
# Without this file nothing changes: a plain `docker compose -f docker-compose.yml
# -f deploy/linux/docker-compose.host.yml up -d` still starts every service.
# Adding this file puts the Observability Profile behind the compose profile
# "observability", so `up -d` leaves it alone. Bootstrap and apply-update add it
# when POWERSVX_PROFILE=core (see deploy/linux/select-profile.sh).
#
# The Control Plane keeps zones, Filter feeds, tokens and users in files, so it runs
# without a database here: it does not wait for Postgres and starts with the
# database disabled. Query history is unavailable until the Observability Profile
# (which includes Postgres) is added.
services:
  powersvx:
    environment:
      - POWERSVX_DATABASE_ENABLED=0
    depends_on:
      postgres: !reset null
  node-exporter:
    profiles: [observability]
  prometheus:
    profiles: [observability]
  grafana:
    profiles: [observability]
  postgres:
    profiles: [observability]
