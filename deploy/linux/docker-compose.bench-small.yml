# Run the Core services inside the benchmark size slice (2 CPUs, 2 GB by default).
#
#   sudo scripts/bench/size-slice.sh up
#   eval "$(scripts/bench/size-slice.sh env)"
#   bash deploy/linux/gen-unbound-conf.sh && bash deploy/linux/gen-dnsdist-conf.sh
#   eval "$(deploy/linux/calc-mem-env.sh)"
#   docker compose -f docker-compose.yml -f deploy/linux/docker-compose.host.yml \
#     -f deploy/linux/docker-compose.core.yml -f deploy/linux/docker-compose.bench-small.yml \
#     up -d dnsdist unbound powersvx
#
# The Core overlay keeps the Observability Profile (Postgres, Prometheus, Grafana,
# node-exporter) stopped and runs the Control Plane without a database. Watchtower is part
# of the Core Profile and is left out because it does not serve DNS.
services:
  powersvx:
    cgroup_parent: powersvx-bench.slice
  unbound:
    cgroup_parent: powersvx-bench.slice
  dnsdist:
    cgroup_parent: powersvx-bench.slice
