-- AUTO-GENERATED by deploy/linux/gen-dnsdist-conf.sh
-- host Mem=2048MB packetCache=200000 authPort=5354 recPort=5353

setACL({"0.0.0.0/0", "::/0"})
addLocal("0.0.0.0:53")
addLocal("[::]:53")

-- Auto-enable DoT (:853), DoH (:443) and DoQ (UDP :784) when TLS certificates are mounted at /etc/dnsdist/certs/
local function fileExists(p)
  local f = io.open(p, "r")
  if f ~= nil then f:close(); return true end
  return false
end
local tlsCert = "/etc/dnsdist/certs/fullchain.pem"
local tlsKey = "/etc/dnsdist/certs/privkey.pem"
if fileExists(tlsCert) and fileExists(tlsKey) then
  addTLSLocal("0.0.0.0:853", tlsCert, tlsKey)
  addDOHLocal("0.0.0.0:443", tlsCert, tlsKey, "/dns-query")
  addDOQLocal("0.0.0.0:784", tlsCert, tlsKey)
  infolog("powersvx DoT (:853), DoH (:443) and DoQ (:784) enabled with /etc/dnsdist/certs/")
end

local aclPath = "/etc/dnsdist/blocklist/acl.txt"
local aclLast = nil
local function reloadACL()
  local f = io.open(aclPath, "r")
  if f == nil then return end
  local body = f:read("*a")
  f:close()
  if body == nil or body == aclLast then return end
  aclLast = body
  local masks = {}
  for line in body:gmatch("[^\r\n]+") do
    line = line:gsub("^%s+", ""):gsub("%s+$", "")
    if line ~= "" and line:sub(1, 1) ~= "#" then table.insert(masks, line) end
  end
  if #masks == 0 then return end
  local ok, err = pcall(setACL, masks)
  if ok then
    infolog("powersvx acl loaded: " .. #masks .. " masks")
  else
    errlog("powersvx acl rejected: " .. tostring(err))
  end
end

local dynPath = "/etc/dnsdist/blocklist/dynblock.lua"
local dynLast = nil
local function reloadDynBlock()
  local f = io.open(dynPath, "r")
  if f == nil then return end
  local body = f:read("*a")
  f:close()
  if body == nil or body == dynLast then return end
  dynLast = body
  local ok, err = pcall(dofile, dynPath)
  if ok then
    infolog("powersvx dynblock rules reloaded")
  else
    errlog("powersvx dynblock reload error: " .. tostring(err))
  end
end

local bansPath = "/etc/dnsdist/blocklist/bans.txt"
local bansLast = nil
local function reloadBans()
  local f = io.open(bansPath, "r")
  if f == nil then return end
  local body = f:read("*a")
  f:close()
  if body == nil or body == bansLast then return end
  bansLast = body
  local nmg = newNMG()
  local cnt = 0
  for line in body:gmatch("[^\r\n]+") do
    line = line:gsub("^%s+", ""):gsub("%s+$", "")
    if line ~= "" and line:sub(1, 1) ~= "#" then
      nmg:addMask(line)
      cnt = cnt + 1
    end
  end
  if cnt > 0 then
    pcall(addDynBlocks, nmg, "PowerSVX manual ban", 86400)
    infolog("powersvx manual bans applied: " .. cnt)
  end
end

reloadACL()
reloadDynBlock()
reloadBans()
function maintenance()
  reloadACL()
  reloadDynBlock()
  reloadBans()
  if dbrg ~= nil then
    pcall(function() dbrg:apply() end)
  end
end

-- controlSocket disabled; use webserver on 127.0.0.1:8083

setRingBuffersSize(1000000)
setMaxUDPOutstanding(65535)
setMaxTCPClientThreads(4)
setMaxTCPQueuedConnections(1000)
setMaxTCPConnectionsPerClient(20)

newServer({address="127.0.0.1:5353", name="unbound", sockets=8, checkInterval=2, maxCheckFailures=5, checkTimeout=2000, rise=2})
newServer({address="127.0.0.1:5354", name="powersvx-auth", pool="auth", useProxyProtocol=true, checkInterval=5, maxCheckFailures=3, checkTimeout=2000, rise=2})
setServerPolicy(leastOutstanding)

pc = newPacketCache(200000,{maxTTL=86400, minTTL=60, maxNegativeTTL=300})
getPool(""):setCache(pc)

local authzonesKVS = newCDBKVStore("/etc/dnsdist/blocklist/authzones.cdb",30)
local whitelistKVS = newCDBKVStore("/etc/dnsdist/blocklist/whitelist.cdb",30)
local customBlackKVS = newCDBKVStore("/etc/dnsdist/blocklist/custom_blacklist.cdb",30)
local blocklistKVS = newCDBKVStore("/etc/dnsdist/blocklist/domains.cdb",30)
local suffixLookupKey = KeyValueLookupKeySuffix(2,false)

whitelistSMN = newSuffixMatchNode()
whitelistSMN:add(newDNSName("bca.co.id."))
whitelistSMN:add(newDNSName("klikbca.com."))
whitelistSMN:add(newDNSName("bankmandiri.co.id."))
whitelistSMN:add(newDNSName("mandiri.co.id."))
whitelistSMN:add(newDNSName("livin.co.id."))
whitelistSMN:add(newDNSName("bri.co.id."))
whitelistSMN:add(newDNSName("bni.co.id."))
whitelistSMN:add(newDNSName("btn.co.id."))
whitelistSMN:add(newDNSName("bsi.co.id."))

-- 0. Route inbound DNS NOTIFY directly to PowerSVX Auth/Slave handler :5354
addAction(OpcodeRule(DNSOpcode.Notify), PoolAction("auth"))

-- 1. Route hosted authoritative zones (+ ACME challenges) directly to PowerSVX Auth :5354
addAction(KeyValueStoreLookupRule(authzonesKVS,suffixLookupKey), PoolAction("auth"))

-- 2. Whitelist (official banks + custom UI whitelist) bypasses all filters
addAction(KeyValueStoreLookupRule(whitelistKVS,suffixLookupKey), PoolAction(""))
addAction(SuffixMatchNodeRule(whitelistSMN), PoolAction(""))

-- 3. Custom operator/admin blacklist
addAction(AndRule({KeyValueStoreLookupRule(customBlackKVS,suffixLookupKey), QTypeRule(DNSQType.AAAA)}), SpoofAction("::"))
addAction(AndRule({KeyValueStoreLookupRule(customBlackKVS,suffixLookupKey), QTypeRule(DNSQType.A)}), SpoofAction("139.255.196.196"))
addAction(KeyValueStoreLookupRule(customBlackKVS,suffixLookupKey), RCodeAction(DNSRCode.NOERROR))

addAction(AndRule({QTypeRule(DNSQType.PTR), MaxQPSIPRule(50)}), RCodeAction(DNSRCode.REFUSED))

-- 4. Main RPZ/Kominfo blocklist CDB
addAction(AndRule({KeyValueStoreLookupRule(blocklistKVS,suffixLookupKey), QTypeRule(DNSQType.AAAA)}), SpoofAction("::"))
addAction(AndRule({KeyValueStoreLookupRule(blocklistKVS,suffixLookupKey), QTypeRule(DNSQType.A)}), SpoofAction("139.255.196.196"))
-- Non-A/AAAA queries (e.g. HTTPS type 65, MX, TXT) on blocked domains return NODATA (NOERROR) to prevent upstream leak & trigger browser A/AAAA fallback
addAction(KeyValueStoreLookupRule(blocklistKVS,suffixLookupKey), RCodeAction(DNSRCode.NOERROR))

addAction(AllRule(), PoolAction(""))
setSecurityPollSuffix("")

