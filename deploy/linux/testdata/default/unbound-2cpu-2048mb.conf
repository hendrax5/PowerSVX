# PowerSVX hybrid backend: Unbound recursive on loopback only.
# AUTO-GENERATED by deploy/linux/gen-unbound-conf.sh - mode=dnsdist-backend
# host MemTotal=2048MB nproc=2 -> threads=2 msg=64m rrset=128m

server:
    verbosity: 1
    username: "_unbound"
    directory: "/opt/unbound/etc/unbound"
    do-daemonize: no

    interface: 127.0.0.1
    port: 5353
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no
    so-reuseport: yes

    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    qname-minimisation: no
    infra-keep-probing: no
    aggressive-nsec: yes
    prefetch: no
    prefetch-key: yes
    domain-insecure: "in-addr.arpa."
    domain-insecure: "ip6.arpa."
    serve-expired: yes
    serve-expired-ttl: 86400
    edns-buffer-size: 1232

    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    msg-cache-size: 64m
    rrset-cache-size: 128m
    key-cache-size: 16m
    neg-cache-size: 8m
    outgoing-range: 2048
    num-queries-per-thread: 1024
    jostle-timeout: 200
    unwanted-reply-threshold: 10000

    auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"

    include: /opt/unbound/etc/unbound/a-records.conf
    include: /opt/unbound/etc/unbound/srv-records.conf
    include: /opt/unbound/etc/unbound/rpz/runtime-server.conf

include: /opt/unbound/etc/unbound/rpz/runtime-zones.conf

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    control-use-cert: no
