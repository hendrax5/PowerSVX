name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Go test
        run: go test -v -timeout 5m ./...
      - name: Go build
        run: go build -o powersvx ./cmd/powersvx
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web build
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Dataplane black-box test (Docker)
        run: POWERSVX_DOCKER_TESTS=1 go test -v -count=1 -timeout 10m ./test/dataplane/
