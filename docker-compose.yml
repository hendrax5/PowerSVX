services:
  powersvx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: powersvx
    environment:
      - PG_PASSWORD=${PG_PASSWORD:-PowerSVXDevPass}
      - API_TOKEN=${API_TOKEN:-dev-token}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - TZ=Asia/Jakarta
    volumes:
      # Named volume avoids Windows bind-mount permission denied for USER powersvx
      - powersvx-cache:/data/cache
      - ./configs/powersvx.docker.toml:/etc/PowerSVX/powersvx.toml:ro
      - ./configs/sample-blocklist.txt:/etc/PowerSVX/sample-blocklist.txt:ro
    ports:
      - "5453:53/udp"
      - "5453:53/tcp"
      - "8853:853/tcp"
      - "8443:443/tcp"
      - "784:784/udp"
      - "5380:5380"
      - "9100:9100"
    cap_add:
      - NET_BIND_SERVICE
      # For [server] tproxy = true (Linux IP_TRANSPARENT), also add NET_ADMIN
      # and prefer network_mode: host — published ports are not enough for TPROXY.
      # - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5380/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: powersvx-prometheus
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - powersvx
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: powersvx-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: powersvx-postgres
    environment:
      - POSTGRES_DB=PowerSVX
      - POSTGRES_USER=PowerSVX
      - POSTGRES_PASSWORD=${PG_PASSWORD:-PowerSVXDevPass}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./configs/powersvx.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Avoid clash with other local Postgres (e.g. noc_db on 5432)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U PowerSVX -d PowerSVX"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  powersvx-cache:
