services:
  powersvx:
    build:
      context: .
      dockerfile: Dockerfile
      # Host network during build avoids Docker-bridge DNS/NAT issues that
      # make Alpine/Debian package mirrors look "temporarily" unavailable.
      network: host
      args:
        VERSION: ${POWERSVX_VERSION:-1.6.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: powersvx
    env_file:
      - path: .env
        required: false
    environment:
      - PG_PASSWORD=${PG_PASSWORD:-PowerSVXDevPass}
      - API_TOKEN=${API_TOKEN:-dev-token}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - TZ=Asia/Jakarta
      - GOGC=${GOGC:-50}
      - POWERSVX_MEM_PERCENT=${POWERSVX_MEM_PERCENT:-70}
    logging: &powersvx-log
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      # Named volume avoids Windows bind-mount permission denied for USER powersvx
      - powersvx-cache:/data/cache
      - ./configs/powersvx.docker.toml:/etc/PowerSVX/powersvx.toml:ro
      - ./configs/sample-blocklist.txt:/etc/PowerSVX/sample-blocklist.txt:ro
    ports:
      - "0.0.0.0:5453:53/udp"
      - "0.0.0.0:5453:53/tcp"
      - "0.0.0.0:8853:853/tcp"
      - "0.0.0.0:8443:443/tcp"
      - "0.0.0.0:784:784/udp"
      - "0.0.0.0:5380:5380"
      - "0.0.0.0:9100:9100"
    cap_add:
      - NET_BIND_SERVICE
      # For [server] tproxy = true (Linux IP_TRANSPARENT), also add NET_ADMIN
      # and prefer network_mode: host — published ports are not enough for TPROXY.
      # - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5380/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: powersvx-prometheus
    logging: *powersvx-log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "0.0.0.0:9091:9090"
    depends_on:
      - powersvx
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: powersvx-grafana
    logging: *powersvx-log
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Embed in PowerSVX UI (/analytics); anonymous viewer for iframe without login wall
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: powersvx-postgres
    logging: *powersvx-log
    environment:
      - POSTGRES_DB=PowerSVX
      - POSTGRES_USER=PowerSVX
      - POSTGRES_PASSWORD=${PG_PASSWORD:-PowerSVXDevPass}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./configs/powersvx.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Avoid clash with other local Postgres (e.g. noc_db on 5432)
      - "0.0.0.0:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U PowerSVX -d PowerSVX"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  powersvx-cache:
  grafana-data:
