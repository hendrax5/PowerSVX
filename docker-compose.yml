services:
  powersvx:
    image: ${POWERSVX_IMAGE:-ghcr.io/hendrax5/powersvx}:${POWERSVX_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # Host network during build avoids Docker-bridge DNS/NAT issues that
      # make Alpine/Debian package mirrors look "temporarily" unavailable.
      network: host
      args:
        VERSION: ${POWERSVX_VERSION:-1.7.1}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: powersvx
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      - path: .env
        required: false
    environment:
      - PG_PASSWORD=${PG_PASSWORD:-PowerSVXDevPass}
      - API_TOKEN=${API_TOKEN:-dev-token}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - TZ=Asia/Jakarta
      - GOGC=${GOGC:-50}
      # 55% host RAM soft budget (scales on upgrade; leave room for Unbound/Postgres/OS).
      - POWERSVX_MEM_PERCENT=${POWERSVX_MEM_PERCENT:-55}
    logging: &powersvx-log
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      # Named volume avoids Windows bind-mount permission denied for USER powersvx
      - powersvx-cache:/data/cache
      - ./configs/powersvx.docker.toml:/etc/PowerSVX/powersvx.toml:ro
      - ./configs/sample-blocklist.txt:/etc/PowerSVX/sample-blocklist.txt:ro
    ports:
      - "0.0.0.0:5453:53/udp"
      - "0.0.0.0:5453:53/tcp"
      - "0.0.0.0:8853:853/tcp"
      - "0.0.0.0:8443:443/tcp"
      - "0.0.0.0:784:784/udp"
      - "0.0.0.0:5380:5380"
      - "0.0.0.0:9100:9100"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5380/api/v1/health"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 90s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: powersvx-node-exporter
    logging: *powersvx-log
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--web.listen-address=:9101'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "0.0.0.0:9101:9101"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: powersvx-prometheus
    logging: *powersvx-log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - powersvx
      - node-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: powersvx-grafana
    logging: *powersvx-log
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Embed in PowerSVX UI (/analytics); anonymous viewer for iframe without login wall
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: powersvx-postgres
    logging: *powersvx-log
    environment:
      - POSTGRES_DB=PowerSVX
      - POSTGRES_USER=PowerSVX
      - POSTGRES_PASSWORD=${PG_PASSWORD:-PowerSVXDevPass}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./configs/powersvx.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Avoid clash with other local Postgres (e.g. noc_db on 5432)
      - "0.0.0.0:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U PowerSVX -d PowerSVX"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: powersvx-watchtower
    logging: *powersvx-log
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - DOCKER_CONFIG=/config
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      # Daily auto-update check at 03:15 WIB (off-peak, avoids :00 registry burst).
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 15 3 * * *}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Supports private GHCR via `sudo docker login ghcr.io` (reads config.json inside dir).
      # If the directory is missing Docker creates it empty and Watchtower has no login, silently:
      # deploy/linux/registry-preflight.sh (run by bootstrap and apply-update) warns about that.
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/config:ro
    restart: unless-stopped

volumes:
  powersvx-cache:
  grafana-data:
