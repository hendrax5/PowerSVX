# PowerSVX — local (Phase 3)

[server]
bind_address = "0.0.0.0"
udp_port = 5353
tcp_port = 5353
dot_port = 8853
doh_port = 8443
doq_port = 784
workers = 0

[server.tls]
enabled = false
cert_file = "./certs/fullchain.pem"
key_file = "./certs/privkey.pem"

[database]
enabled = false

[cache]
path = "./data/cache"
max_size_mb = 512
ttl_seconds = 300
negative_ttl = 60

[resolver]
mode = "forward"
forwarders = ["1.1.1.1:53", "8.8.8.8:53"]
dnssec_mode = "off"
timeout_ms = 3000

[rate_limit]
enabled = true
default_qps = 100
default_burst = 200
block_duration = 300
whitelist = ["127.0.0.1/32", "::1/128"]

[rpz]
enabled = true
update_interval = 3600
policies = [
  { name = "sample", source = "./configs/sample-blocklist.txt", format = "hosts", action = "nxdomain" }
]

[metrics]
prometheus_enabled = true
prometheus_bind = "0.0.0.0:9100"

[tsig]
enabled = false

[api]
rest_enabled = true
rest_bind = "0.0.0.0:5380"

[logging]
level = "info"
format = "json"
