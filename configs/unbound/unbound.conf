# PowerSVX hybrid: Unbound as recursive backend (localhost only).
# Listen on 127.0.0.1:5353 so PowerSVX can own public :53 (TPROXY / UI / RPZ).
#
# Mounted into the unbound container — see deploy/linux/docker-compose.host.yml

server:
    verbosity: 1
    interface: 127.0.0.1
    port: 5353
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no

    # Localhost only — never expose recursive Unbound on the public interface.
    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    qname-minimisation: yes
    aggressive-nsec: yes
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400

    # Tune for multi-k QPS recursive behind PowerSVX (adjust to host RAM/CPU).
    num-threads: 4
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    msg-cache-size: 512m
    rrset-cache-size: 1024m
    key-cache-size: 128m
    neg-cache-size: 64m
    so-rcvbuf: 4m
    so-sndbuf: 4m
    outgoing-range: 8192
    num-queries-per-thread: 4096
    jostle-timeout: 200
    edns-buffer-size: 1232
    unwanted-reply-threshold: 10000

    # Root trust anchor shipped with mvance/unbound image.
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"

remote-control:
    control-enable: no
