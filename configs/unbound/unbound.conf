# Sample only: deploy/linux/gen-unbound-conf.sh regenerates this file, sized for the node,
# on every bootstrap and update. Keep it in step with the generator (control interface on,
# Control Plane runtime files included): a node that runs this copy unregenerated cannot
# be reloaded by the Control Plane.
# PowerSVX: Unbound recursive backend (localhost only).
# Compatible with mvance/unbound image entrypoint (/unbound.sh).
# Listen on 127.0.0.1:5353 — PowerSVX owns public :53.

server:
    verbosity: 1
    username: "_unbound"
    directory: "/opt/unbound/etc/unbound"
    do-daemonize: no

    interface: 127.0.0.1
    port: 5353
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no
    so-reuseport: yes

    # Localhost only — never expose recursive Unbound publicly.
    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    qname-minimisation: no
    infra-keep-probing: no
    aggressive-nsec: yes
    prefetch: no
    prefetch-key: yes
    # PTR resolves normally; CPE PTR storms are rate-limited per client in dnsdist.
    domain-insecure: "in-addr.arpa."
    domain-insecure: "ip6.arpa."
    serve-expired: yes
    serve-expired-ttl: 86400
    edns-buffer-size: 1232

    num-threads: 4
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    msg-cache-size: 256m
    rrset-cache-size: 512m
    key-cache-size: 64m
    neg-cache-size: 32m
    outgoing-range: 4096
    num-queries-per-thread: 2048
    jostle-timeout: 200
    unwanted-reply-threshold: 10000

    # Created by /unbound.sh via unbound-anchor before exec.
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"

    include: /opt/unbound/etc/unbound/a-records.conf
    include: /opt/unbound/etc/unbound/srv-records.conf
    include: /opt/unbound/etc/unbound/rpz/runtime-server.conf

include: /opt/unbound/etc/unbound/rpz/runtime-zones.conf

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    control-use-cert: no
