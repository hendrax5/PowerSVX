# PowerSVX Phase 2 smoke test — TLS + DNSSEC opportunistic

[server]
bind_address = "127.0.0.1"
udp_port = 5454
tcp_port = 5454
dot_port = 8853
doh_port = 8443
workers = 0

[server.tls]
enabled = true
cert_file = "./certs/fullchain.pem"
key_file = "./certs/privkey.pem"

[database]
enabled = false

[cache]
path = "./data/cache-p2"
max_size_mb = 64
ttl_seconds = 300
negative_ttl = 60

[resolver]
mode = "forward"
forwarders = ["1.1.1.1:53", "8.8.8.8:53"]
dnssec_mode = "opportunistic"
edns_buffer_size = 1232
timeout_ms = 5000

[api]
rest_enabled = true
rest_bind = "127.0.0.1:5383"

[logging]
level = "info"
format = "json"
