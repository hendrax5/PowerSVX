# PowerSVX — Docker Compose (Phase 2)

[server]
bind_address = "0.0.0.0"
udp_port = 53
tcp_port = 53
dot_port = 853
doh_port = 443
workers = 0

[server.tls]
enabled = true
cert_file = "/etc/PowerSVX/certs/fullchain.pem"
key_file = "/etc/PowerSVX/certs/privkey.pem"

[database]
enabled = true
type = "postgres"
host = "postgres"
port = 5432
database = "PowerSVX"
user = "PowerSVX"
password = "${PG_PASSWORD}"
max_connections = 20

[cache]
type = "badger"
path = "/data/cache"
max_size_mb = 512
ttl_seconds = 300
negative_ttl = 60

[resolver]
mode = "forward"
forwarders = ["1.1.1.1:53", "8.8.8.8:53"]
dnssec_validation = true
dnssec_mode = "opportunistic"
qname_minimization = true
edns_buffer_size = 1232
timeout_ms = 3000

[api]
rest_enabled = true
rest_bind = "0.0.0.0:5380"
auth_type = "none"
api_token = "${API_TOKEN}"

[logging]
level = "info"
format = "json"
query_log_enabled = false
query_log_destination = "postgresql"
query_log_retention_days = 30
