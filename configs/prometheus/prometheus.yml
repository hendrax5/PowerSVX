global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Bridge networking (powersvx service DNS name)
  - job_name: powersvx
    static_configs:
      - targets: ["powersvx:9100"]
  # Host networking (network_mode: host) — metrics on the Docker host
  - job_name: powersvx-host
    static_configs:
      - targets: ["host.docker.internal:9100"]
  # node-exporter (CPU / MemAvailable / disk) — listen :9101
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9101"]
  - job_name: node-host
    static_configs:
      - targets: ["host.docker.internal:9101"]
