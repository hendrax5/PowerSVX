# PowerSVX — host-network CONTROL PLANE (dnsdist owns public :53)
#
# DNS dataplane: dnsdist (the only one; POWERSVX_DNS_DATAPLANE=dnsdist or unset).
# This process serves UI/API :5380 + the Auth Backend on 127.0.0.1:5354 (zones, AXFR, NOTIFY via dnsdist).
# Recurse backend is always Unbound on 127.0.0.1:5353 — never point forwarders at :53
# (that is dnsdist/public listen and would loop).

[server]
# The Auth Backend answers only the local Dataplane (dnsdist -> 127.0.0.1:5354).
bind_address = "127.0.0.1"
# Customer DNS is dnsdist :53. This port is the Auth Backend, reached only by dnsdist.
udp_port = 5354
tcp_port = 5354
dot_port = 0
doh_port = 0
doq_port = 0
workers = 2
tproxy = false

[server.tls]
enabled = false
cert_file = "/etc/PowerSVX/certs/fullchain.pem"
key_file = "/etc/PowerSVX/certs/privkey.pem"

[database]
enabled = true
type = "postgres"
host = "127.0.0.1"
port = 5433
database = "PowerSVX"
user = "PowerSVX"
password = "${PG_PASSWORD}"
max_connections = 20

[cache]
type = "badger"
path = "/data/cache"
max_size_mb = 64
ttl_seconds = 300
min_ttl = 60
negative_ttl = 60
serve_stale = false
stale_ttl = 0
prefetch_pct = 0

[resolver]
# Unbound recurses by itself. Do NOT list 127.0.0.1:5353 (Unbound) or :53 (dnsdist) as a
# forwarder: Unbound would forward to itself and answer SERVFAIL for every name outside
# the hosted zones. The Control Plane refuses to write such a forwarder to Unbound.
# To use an upstream resolver instead, set mode = "forward" and list that resolver.
mode = "recursive"
forwarders = []
forward_on_fail = false
dnssec_mode = "off"
edns_buffer_size = 1232
timeout_ms = 700
fallback_timeout_ms = 400
max_inflight = 256
ecs_enabled = false

[rate_limit]
enabled = true
default_qps = 50
default_burst = 20
block_duration = 60
whitelist = ["127.0.0.1/32", "::1/128"]
global_qps = 0
global_burst = 0

[rpz]
enabled = true
hot_cache_max = 10000
hot_seed_top_n = 0
update_interval = 0
axfr_update_interval = 86400
policies = [
  { name = "sample", source = "/etc/PowerSVX/sample-blocklist.txt", format = "hosts", action = "nxdomain" }
]

[geodns]
enabled = false
database_path = "/data/dbip-country-lite.mmdb"
default_tag = "default"

[split_horizon]
enabled = false

[metrics]
prometheus_enabled = true
prometheus_bind = "0.0.0.0:9100"

[tsig]
enabled = false

[acl]
deny_autoban_threshold = 64
deny_autoban_window_sec = 30
deny_autoban_ttl_sec = 300
deny_autoban_nft = true

[transfer]
allow_axfr = false
require_tsig = true

[update]
enabled = false
require_tsig = true

[kominfo_sync]
enabled = false

[api]
rest_enabled = true
rest_bind = "0.0.0.0:5380"
auth_type = "local"
api_token = "${API_TOKEN}"

[logging]
level = "warn"
format = "json"
query_log_enabled = true
query_log_destination = "postgresql"
query_log_retention_days = 3
query_log_max_size_mb = 5120
query_log_mask_ip = false
query_log_sample_rate = 0.05
